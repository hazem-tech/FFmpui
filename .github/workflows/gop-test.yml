name: Keyframe interval test

# Temporary experiment: how much does the keyframe interval (-g) change the
# file size with Apple's hardware HEVC encoder (hevc_videotoolbox, -q:v 1)?
# Uses the real phone clips from the shrk branch's Tests/Fixtures.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/gop-test.yml

defaults:
  run:
    shell: bash

jobs:
  gop:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude/fervent-darwin-6ea2wn
          sparse-checkout: Tests/Fixtures

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Test (x265 Size mode, single keyframe vs every 10 s)
        run: |
          set -u
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          summary() { tee -a "$GITHUB_STEP_SUMMARY"; }
          pct() { awk -v a="$1" -v b="$2" 'BEGIN{ printf "%+.1f%%", (a-b)*100/b }'; }
          # Size mode's settings from shrk/compress_video.sh, without keyint.
          P="qpmin=51:aq-mode=0:sao=0:me=umh:subme=0:merange=200:max-tu-size=4:rc-lookahead=5:cbqpoffs=12:crqpoffs=12:rskip=2:max-merge=1"
          {
            echo "### x265 Size mode: keyint=-1 (single) vs a keyframe every 10 s (240 at 24 fps)"
            echo
            echo "| clip | scale | audio KB | single: total KB | 10 s: total KB | total | single: video KB | 10 s: video KB | video |"
            echo "|---|---|---|---|---|---|---|---|---|"
          } | summary
          for spec in "IMG_6758.mov|11" "samsung.mp4|4"; do
            IFS='|' read -r name loops <<< "$spec"
            f="$out/long_$name"
            ffmpeg -v error -y -stream_loop "$loops" -i "Tests/Fixtures/$name" -c copy "$f"
            ffmpeg -v error -y -i "$f" -vn -c:a copy "$out/audio.m4a"
            audio=$(stat -f %z "$out/audio.m4a")
            for sc in 1 2 4; do
              vf="fps=24"; [ "$sc" = 1 ] || vf="fps=24,scale=trunc(iw/$sc/2)*2:trunc(ih/$sc/2)*2"
              for k in -1 240; do
                ffmpeg -v error -y -i "$f" -vf "$vf" -c:a copy -c:v libx265 -tag:v hvc1 -preset veryfast -crf 51 \
                  -x265-params "log-level=error:keyint=$k:$P" "$out/k$k.mp4"
              done
              a=$(stat -f %z "$out/k-1.mp4"); b=$(stat -f %z "$out/k240.mp4")
              echo "| $name | 1/$sc | $((audio/1024)) | $((a/1024)) | $((b/1024)) | $(pct $b $a) | $(((a-audio)/1024)) | $(((b-audio)/1024)) | $(pct $((b-audio)) $((a-audio))) |" | summary
            done
          done
