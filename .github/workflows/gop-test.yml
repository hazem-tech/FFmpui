name: Keyframe interval test

# Temporary experiment: how much does the keyframe interval (-g) change the
# file size with Apple's hardware HEVC encoder (hevc_videotoolbox, -q:v 1)?
# Uses the real phone clips from the shrk branch's Tests/Fixtures.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/gop-test.yml

defaults:
  run:
    shell: bash

jobs:
  gop:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude/fervent-darwin-6ea2wn
          sparse-checkout: Tests/Fixtures

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Test
        run: |
          set -u
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          summary() { tee -a "$GITHUB_STEP_SUMMARY"; }
          keyframes() {
            ffprobe -v error -select_streams v:0 -skip_frame nokey -show_entries frame=pts_time -of csv=p=0 "$1" | wc -l | tr -d ' '
          }
          pct() { awk -v a="$1" -v b="$2" 'BEGIN{ printf "%+.1f%%", (a-b)*100/b }'; }
          # The fixtures are 5 s and 12 s: loop each to about 60 s.
          for spec in "IMG_6758.mov|11" "samsung.mp4|4"; do
            IFS='|' read -r name loops <<< "$spec"
            f="$out/long_$name"
            ffmpeg -v error -y -stream_loop "$loops" -i "Tests/Fixtures/$name" -c copy "$f"
            ffmpeg -v error -y -i "$f" -vn -c:a copy "$out/audio.m4a"
            audio=$(stat -f %z "$out/audio.m4a")
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            for mode in "mode3|scale=-2:240|12" "mode1|scale=trunc(iw/3/2)*2:-2|24"; do
              IFS='|' read -r m vf fps <<< "$mode"
              {
                echo "### $name looped to ${dur%.*} s · $m ($vf, $fps fps) · audio $((audio/1024)) KB"
                echo
                echo "| -g | keyframes | total KB | video KB | total vs g=600 | video vs g=600 |"
                echo "|---|---|---|---|---|---|"
              } | summary
              base_t=0; base_v=0
              for g in 600 default 12 24 48 120 240; do
                gopt=""; [ "$g" = default ] || gopt="-g $g"
                o="$out/${m}_g${g}.mp4"
                if ! ffmpeg -v error -y -i "$f" -vf "$vf" -r "$fps" -c:a copy \
                     -c:v hevc_videotoolbox -tag:v hvc1 -q:v 1 $gopt "$o" 2> "$out/err.txt"; then
                  echo "| $g | failed: $(head -c 200 "$out/err.txt" | tr '\n|' '  ') | | | | |" | summary
                  continue
                fi
                t=$(stat -f %z "$o"); v=$((t - audio)); k=$(keyframes "$o")
                if [ "$base_t" = 0 ]; then base_t=$t; base_v=$v; fi
                echo "| $g | $k | $((t/1024)) | $((v/1024)) | $(pct $t $base_t) | $(pct $v $base_v) |" | summary
              done
              echo | summary
            done
          done
