name: Build

# Builds the Mac and iOS apps and fails on any compiler or project warning,
# so deprecations and other warnings can't pile up.

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Build Mac app
        run: |
          set -o pipefail
          xcodebuild -project shrk.xcodeproj -target shrk -configuration Debug \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build 2>&1 | tee build.log

      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project shrk.xcodeproj -target shrk-iOS -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build 2>&1 | tee build-ios.log
          test -d build/Debug-iphonesimulator/shrk-iOS.app

      # Xcode's App Intents step logs "Metadata extraction skipped" as a
      # warning for every app without App Intents; that one is just a note.
      - name: No warnings
        run: |
          if grep -hE "(warning|error):" build.log build-ios.log \
               | grep -v "appintentsmetadataprocessor.*Metadata extraction skipped" \
               | sort -u | tee warnings.txt | grep -q .; then
            {
              echo "### Build warnings"
              echo '```'
              cat warnings.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do echo "::error::$line"; done < warnings.txt
            exit 1
          fi
          echo "No warnings"

      - name: Check script bundled
        run: test -f build/Debug/shrk.app/Contents/Resources/compress_video.sh
