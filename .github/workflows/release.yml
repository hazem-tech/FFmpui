name: Release

# Every push to main (a merged pull request) builds the Mac app, signs it
# ad hoc (no Apple Developer account needed) and publishes it as a GitHub
# release tagged v<MARKETING_VERSION>.<run number>, e.g. v1.0.12.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Releases go out one at a time, in order.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  mac:
    name: Mac app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' shrk.xcodeproj/project.pbxproj | head -n1)
          [ -n "$version" ] || { echo "::error::No MARKETING_VERSION in the project"; exit 1; }
          tag="v$version.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      # The latest macOS runs only on Apple silicon, so arm64 is enough.
      - name: Build (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project shrk.xcodeproj -target shrk -configuration Release \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build | tail -n 20

      - name: Sign and check
        run: |
          app=build/Release/shrk.app
          test -f "$app/Contents/Resources/compress_video.sh"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"
          defaults read "$PWD/$app/Contents/Info.plist" CFBundleShortVersionString

      - name: Package
        run: |
          tag="${{ steps.version.outputs.tag }}"
          mkdir -p dist dmg
          ditto -c -k --keepParent build/Release/shrk.app "dist/shrk-$tag-macOS.zip"
          ditto build/Release/shrk.app dmg/shrk.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname shrk -srcfolder dmg -format UDZO -ov "dist/shrk-$tag-macOS.dmg"
          cd dist
          for f in *.zip *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -l

      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          Download **shrk-…-macOS.dmg** (or the .zip), then drag **shrk** into **Applications**.

          shrk is ad-hoc signed and not notarized by Apple, so macOS blocks it the first time you open it:

          1. Open shrk once; macOS says it can't be opened. Click **Done**.
          2. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.

          Or run this in Terminal:

          ```bash
          xattr -dr com.apple.quarantine /Applications/shrk.app
          ```

          shrk needs FFmpeg from [Homebrew](https://brew.sh):

          ```bash
          brew install ffmpeg
          ```

          **Requires the latest macOS release** on an Apple silicon Mac.

          Each file has a `.sha256` checksum next to it (`shasum -a 256 -c <file>.sha256`).

          ## Changes
          NOTES

      # Anywhere but main (a test run), the files are kept as a workflow
      # artifact instead of a release.
      - name: Keep as artifact (not main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: shrk-${{ steps.version.outputs.tag }}-macOS
          path: |
            dist/
            notes.md

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "shrk $tag" \
            --notes-file notes.md \
            --generate-notes
