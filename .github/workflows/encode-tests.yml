name: Encode tests

# Compresses the test clips (Tests/Fixtures + Tests/make_fixtures.sh) in every
# mode and scale and checks each result with Tests/check_output.sh: size,
# frame rate, rotation, bit-identical audio, metadata, file dates, HDR.
# Each job adds its results table to the run summary.

on:
  push:
    paths-ignore: [README.md]
  pull_request:
    paths-ignore: [README.md]
  workflow_dispatch:

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# bash with pipefail, so "… | tee" steps fail when the tests do.
defaults:
  run:
    shell: bash

jobs:
  probe:
    name: What the runner can do
    runs-on: macos-26
    steps:
      - name: Install tools
        run: brew install ffmpeg exiftool

      - name: Report
        run: |
          {
            echo "### Runner"
            echo '```'
            sysctl -n machdep.cpu.brand_string; sysctl -n hw.ncpu
            sw_vers
            ffmpeg -hide_banner -version | head -n1
            echo "--- encoders"
            ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "hevc|265" || true
            echo "--- libvmaf"
            ffmpeg -hide_banner -filters 2>/dev/null | grep -E "vmaf" || echo "no libvmaf"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  script:
    name: Script · ${{ matrix.mode }} · ${{ matrix.fixture }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        mode: [size, quality]
        fixture: [IMG_6758.mov, samsung.mp4, hlg60.mov, clip.mp4, film23.mov]
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"

      # The app needs only ffmpeg; ExifTool is for reading tags in the checks.
      - name: Install tools
        run: brew install ffmpeg exiftool

      - name: Build the harness (MetadataCopier)
        run: Tests/run_transcoder.sh --build "$RUNNER_TEMP/transcoder-harness"

      - name: Make test clips
        run: Tests/make_fixtures.sh "$RUNNER_TEMP/fixtures"

      - name: Compress and check
        run: |
          echo "### ${{ matrix.mode }} · ${{ matrix.fixture }}" >> "$GITHUB_STEP_SUMMARY"
          Tests/run_tests.sh script ${{ matrix.mode }} "$RUNNER_TEMP/fixtures/${{ matrix.fixture }}" "$RUNNER_TEMP/transcoder-harness" | tee -a "$GITHUB_STEP_SUMMARY"

  transcoder:
    name: Shared encoder (iOS + Mac) · ${{ matrix.fixture }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        fixture: [IMG_6758.mov, samsung.mp4, hlg60.mov, clip.mp4, film23.mov]
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$XCODE"
          xcrun swiftc --version

      - name: Install tools
        run: brew install ffmpeg exiftool

      - name: Build the harness
        run: Tests/run_transcoder.sh --build "$RUNNER_TEMP/transcoder-harness"

      - name: Make test clips
        run: Tests/make_fixtures.sh "$RUNNER_TEMP/fixtures"

      - name: Compress and check
        run: |
          {
            echo "### Shared encoder · ${{ matrix.fixture }}"
            echo '```'
            "$RUNNER_TEMP/transcoder-harness" --encoders
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          Tests/run_tests.sh harness "$RUNNER_TEMP/transcoder-harness" "$RUNNER_TEMP/fixtures/${{ matrix.fixture }}" | tee -a "$GITHUB_STEP_SUMMARY"

  metadata:
    name: Metadata comparison · ${{ matrix.fixture }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        fixture: [IMG_6758.mov, samsung.mp4, hlg60.mov, clip.mp4, film23.mov, android.mp4]
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"

      - name: Install tools
        run: brew install ffmpeg exiftool

      - name: Build the harness
        run: Tests/run_transcoder.sh --build "$RUNNER_TEMP/transcoder-harness"

      - name: Make test clips
        run: Tests/make_fixtures.sh "$RUNNER_TEMP/fixtures"

      # Android-style metadata (make, model and location as UserData, plus
      # the Android version), as Samsung and other Android phones write it.
      - name: Android-style clip
        if: matrix.fixture == 'android.mp4'
        run: |
          f="$RUNNER_TEMP/fixtures/android.mp4"
          ffmpeg -nostdin -loglevel error -y -noautorotate -i Tests/Fixtures/IMG_6758.mov -map 0:v:0 -map 0:a \
            -c copy -map_metadata -1 -metadata creation_time=2026-11-20T21:42:37Z "$f"
          exiftool -q -m -overwrite_original '-UserData:Make=samsung' '-UserData:Model=SM-S918B' \
            '-UserData:GPSCoordinates=40.7128, -74.0060, 10' '-Keys:AndroidVersion=14' "$f"
          touch -r Tests/Fixtures/IMG_6758.mov "$f"

      - name: Compare
        run: |
          echo "### Metadata · ${{ matrix.fixture }}" >> "$GITHUB_STEP_SUMMARY"
          Tests/compare_metadata.sh "$RUNNER_TEMP/transcoder-harness" "$RUNNER_TEMP/fixtures/${{ matrix.fixture }}" | tee -a "$GITHUB_STEP_SUMMARY"

  shellcheck:
    name: ShellCheck
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install shellcheck
      - run: shellcheck shrk/compress_video.sh Tests/*.sh
