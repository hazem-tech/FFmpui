name: Probe (temporary)

on:
  push:
    branches: [claude/fervent-darwin-6ea2wn]
    paths: [.github/workflows/probe.yml]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-27, macos-latest, macos-26-xlarge, macos-27-arm64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Xcodes
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
